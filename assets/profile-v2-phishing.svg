<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Phishing Email Investigation</title><desc id="desc">02.2 / FEATURED PROJECT</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#081220"/></linearGradient><linearGradient id="edge"><stop stop-color="#b8a4ff"/><stop offset="1" stop-color="#23374e"/></linearGradient></defs><rect x="8" y="12" width="1184" height="356" rx="22" fill="#020812"/><rect x="1" y="1" width="1182" height="353" rx="22" fill="url(#bg)" stroke="#294059"/><path d="M24 2H1155" stroke="url(#edge)" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="44" fill="#b8a4ff" font-size="13" font-weight="600">02.2 / FEATURED PROJECT</text><text x="40" y="91" fill="#f0f7ff" font-size="34" font-weight="700">Phishing Email Investigation</text><text x="40" y="141" fill="#cedded" font-size="23" font-weight="400">Hash a synthetic email, extract headers and URLs, and produce JSON / HTML.</text><text x="40" y="180" fill="#cedded" font-size="23" font-weight="400">Preserve extracted facts separately from the analyst assessment.</text><path d="M40 206H1140" stroke="#294259"/><text x="40" y="255" fill="#b8a4ff" font-size="36" font-weight="700">10</text><text x="40" y="284" fill="#9eb6ce" font-size="17" font-weight="400">extraction checks passed</text><text x="440" y="255" fill="#b8a4ff" font-size="36" font-weight="700">SHA-256</text><text x="440" y="284" fill="#9eb6ce" font-size="17" font-weight="400">sample identification</text><rect x="40" y="307" width="238" height="38" rx="9" fill="#142c43" stroke="#2a4c62"/><text x="56" y="333" fill="#b8a4ff" font-size="17" font-weight="600">PowerShell</text><rect x="296" y="307" width="238" height="38" rx="9" fill="#142c43" stroke="#2a4c62"/><text x="312" y="333" fill="#b8a4ff" font-size="17" font-weight="600">Email analysis</text><rect x="552" y="307" width="238" height="38" rx="9" fill="#142c43" stroke="#2a4c62"/><text x="568" y="333" fill="#b8a4ff" font-size="17" font-weight="600">Evidence handling</text><g transform="translate(1015 213)"><ellipse cx="50" cy="100" rx="58" ry="14" fill="#020914"/><path d="M0 28L48 3L100 29L50 56Z" fill="#b8a4ff"/><path d="M0 28L50 56V111L0 82Z" fill="#244660"/><path d="M50 56L100 29V84L50 111Z" fill="#326f86"/><path d="M50 56V111" stroke="#b8a4ff" stroke-opacity=".6"/></g></g></svg>
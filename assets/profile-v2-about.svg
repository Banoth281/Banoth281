<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">About me</title><desc id="desc">01 / THE ANALYST</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#081220"/></linearGradient><linearGradient id="edge"><stop stop-color="#67e8e2"/><stop offset="1" stop-color="#23374e"/></linearGradient></defs><rect x="8" y="12" width="1184" height="266" rx="22" fill="#020812"/><rect x="1" y="1" width="1182" height="263" rx="22" fill="url(#bg)" stroke="#294059"/><path d="M24 2H1155" stroke="url(#edge)" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="44" fill="#67e8e2" font-size="13" font-weight="600">01 / THE ANALYST</text><text x="40" y="91" fill="#f0f7ff" font-size="34" font-weight="700">About me</text><text x="40" y="139" fill="#cedded" font-size="24" font-weight="400">3+ years of SOC experience across MSSP and enterprise environments.</text><text x="40" y="179" fill="#cedded" font-size="24" font-weight="400">Focused on Microsoft Sentinel, Defender XDR, and identity investigations.</text><text x="40" y="219" fill="#cedded" font-size="24" font-weight="400">I turn telemetry into tested detection logic and clear investigation reports.</text></g></svg>
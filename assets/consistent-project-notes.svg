<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Projects"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#241c38"/><stop offset="1" stop-color="#151121"/></linearGradient></defs><rect x="8" y="12" width="1184" height="286" rx="22" fill="#0e0a16"/><rect x="1" y="1" width="1182" height="283" rx="22" fill="url(#b)" stroke="#51415f"/><text x="40" y="42" font-family="Trebuchet MS,DejaVu Sans,sans-serif" font-size="13" fill="#f6c768" font-weight="700">05 / PROJECTS &amp; DEMOS</text><text x="40" y="91" font-family="Georgia,DejaVu Serif,serif" font-size="34" fill="#fff8ed" font-weight="700">Projects</text><text x="40" y="139" font-family="Trebuchet MS,DejaVu Sans,sans-serif" font-size="23" fill="#dfd5e8" font-weight="400">Select a project card to open its published demo, presentation, or source repository.</text><text x="40" y="178" font-family="Trebuchet MS,DejaVu Sans,sans-serif" font-size="23" fill="#dfd5e8" font-weight="400">Some dashboards show saved or synthetic data when their backend is unavailable.</text><text x="40" y="217" font-family="Trebuchet MS,DejaVu Sans,sans-serif" font-size="23" fill="#dfd5e8" font-weight="400">TfL live requests and saved analytics are distinct; SAP uses a browser simulation.</text><text x="40" y="260" font-family="Trebuchet MS,DejaVu Sans,sans-serif" font-size="18" fill="#b1a0c3" font-weight="400">Demo availability is not confirmed for every service. Local projects link to run instructions.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-labelledby="title desc"><title id="title">Currently exploring</title><desc id="desc">06 / CONTINUOUS DEVELOPMENT</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#081220"/></linearGradient><linearGradient id="edge"><stop stop-color="#82e6c0"/><stop offset="1" stop-color="#23374e"/></linearGradient></defs><rect x="8" y="12" width="1184" height="258" rx="22" fill="#020812"/><rect x="1" y="1" width="1182" height="255" rx="22" fill="url(#bg)" stroke="#294059"/><path d="M24 2H1155" stroke="url(#edge)" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="44" fill="#82e6c0" font-size="13" font-weight="600">06 / CONTINUOUS DEVELOPMENT</text><text x="40" y="91" fill="#f0f7ff" font-size="34" font-weight="700">Currently exploring</text><text x="40" y="141" fill="#f0f7ff" font-size="24" font-weight="600">Detection quality</text><text x="400" y="141" fill="#cedded" font-size="22" font-weight="400">Broader benign, malformed-input, and boundary fixtures.</text><text x="40" y="183" fill="#f0f7ff" font-size="24" font-weight="600">Telemetry &amp; evidence</text><text x="400" y="183" fill="#cedded" font-size="22" font-weight="400">Collector integration and stronger source traceability.</text><text x="40" y="225" fill="#f0f7ff" font-size="24" font-weight="600">Email analysis</text><text x="400" y="225" fill="#cedded" font-size="22" font-weight="400">Robust MIME parsing and richer training samples.</text></g></svg>
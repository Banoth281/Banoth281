<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Windows Authentication Detection</title><desc id="desc">02.1 / FEATURED PROJECT</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#081220"/></linearGradient><linearGradient id="edge"><stop stop-color="#67e8e2"/><stop offset="1" stop-color="#23374e"/></linearGradient></defs><rect x="8" y="12" width="1184" height="356" rx="22" fill="#020812"/><rect x="1" y="1" width="1182" height="353" rx="22" fill="url(#bg)" stroke="#294059"/><path d="M24 2H1155" stroke="url(#edge)" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="44" fill="#67e8e2" font-size="13" font-weight="600">02.1 / FEATURED PROJECT</text><text x="40" y="91" fill="#f0f7ff" font-size="34" font-weight="700">Windows Authentication Detection</text><text x="40" y="141" fill="#cedded" font-size="23" font-weight="400">Collect Event 4625 and correlate failures by host, domain, account, and IP.</text><text x="40" y="180" fill="#cedded" font-size="23" font-weight="400">Validate and deduplicate events; generate CSV and HTML investigation reports.</text><path d="M40 206H1140" stroke="#294259"/><text x="40" y="255" fill="#67e8e2" font-size="36" font-weight="700">31</text><text x="40" y="284" fill="#9eb6ce" font-size="17" font-weight="400">hosted regression checks</text><text x="440" y="255" fill="#67e8e2" font-size="36" font-weight="700">2 / 0</text><text x="440" y="284" fill="#9eb6ce" font-size="17" font-weight="400">local events / alerts</text><rect x="40" y="307" width="238" height="38" rx="9" fill="#142c43" stroke="#2a4c62"/><text x="56" y="333" fill="#67e8e2" font-size="17" font-weight="600">PowerShell</text><rect x="296" y="307" width="238" height="38" rx="9" fill="#142c43" stroke="#2a4c62"/><text x="312" y="333" fill="#67e8e2" font-size="17" font-weight="600">Windows Security</text><rect x